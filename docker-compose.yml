services:
  postgres:
    image: postgres:16-alpine
    container_name: tashkhees-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tashkhees
      POSTGRES_PASSWORD: tashkhees
      POSTGRES_DB: tashkhees
    ports:
      - "5432:5432"
    volumes:
      - tashkhees-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tashkhees -d tashkhees"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailhog:
    image: mailhog/mailhog:latest
    container_name: tashkhees-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI

volumes:
  tashkhees-postgres-data:
